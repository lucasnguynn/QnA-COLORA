name: Validate COLORA Learning Studio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check question bank and JS syntax
        run: node scripts/validate.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Chromium test dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static training site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/colora-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/colora-server.log
          exit 1
      - name: Test desktop and mobile with real browser
        run: node scripts/e2e.mjs
