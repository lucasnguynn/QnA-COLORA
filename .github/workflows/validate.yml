name: Validate COLORA Learning Studio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check question bank and JS syntax
        run: node scripts/validate.mjs
